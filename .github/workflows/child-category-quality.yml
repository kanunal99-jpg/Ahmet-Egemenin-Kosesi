name: Child Category Policy Quality

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  child-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm install
      - name: Category policy regression tests
        run: node --import tsx --test tests/child-category-policy.test.mjs
      - name: TypeScript validation
        run: npm run lint
      - name: Production build
        run: npm run build

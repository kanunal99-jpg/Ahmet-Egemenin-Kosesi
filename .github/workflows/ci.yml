name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, build and migration checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Git diff check
        run: git diff --check

      - name: Validate migration filenames
        shell: bash
        run: |
          set -euo pipefail
          files=(supabase/migrations/*.sql)
          for file in "${files[@]}"; do
            base="$(basename "$file")"
            if [[ ! "$base" =~ ^[0-9]{14}_[a-z0-9_]+\.sql$ ]]; then
              echo "Invalid migration filename: $base"
              exit 1
            fi
          done
          echo "All migration filenames are valid."

  e2e:
    name: Playwright browser tests
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Resolve E2E configuration
        id: e2e_config
        shell: bash
        env:
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: |
          set -euo pipefail
          {
            echo "VITE_SUPABASE_URL=https://ysmpktqnwbgjhtbzpfhc.supabase.co"
            echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}"
          } >> "$GITHUB_OUTPUT"

          if [[ -n "${E2E_EMAIL:-}" && -n "${E2E_PASSWORD:-}" ]]; then
            echo "authenticated_coverage=true" >> "$GITHUB_OUTPUT"
          else
            echo "authenticated_coverage=false" >> "$GITHUB_OUTPUT"
            echo "WARNING: E2E_EMAIL/E2E_PASSWORD are not configured; authenticated E2E coverage will be skipped." >&2
          fi

      - name: Run browser tests
        run: npm run test:e2e
        env:
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          VITE_SUPABASE_URL: ${{ steps.e2e_config.outputs.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ steps.e2e_config.outputs.VITE_SUPABASE_ANON_KEY }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

      - name: Upload Playwright test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-artifacts
          path: test-results/
          if-no-files-found: ignore

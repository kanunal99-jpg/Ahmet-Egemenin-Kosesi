name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, build and migration checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm install

      - name: Audit high and critical dependencies
        shell: bash
        run: |
          set +e
          npm audit --json > /tmp/npm-audit.json
          audit_exit=$?
          set -e
          node <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('/tmp/npm-audit.json', 'utf8'));
          const vulnerabilities = report.vulnerabilities || {};
          const high = Object.entries(vulnerabilities)
            .filter(([, item]) => item.severity === 'high' || item.severity === 'critical')
            .map(([name, item]) => ({
              name,
              severity: item.severity,
              range: item.range,
              fixAvailable: item.fixAvailable,
              via: (item.via || []).map((entry) => typeof entry === 'string' ? entry : `${entry.source || 'advisory'}:${entry.title || ''}`),
            }));
          console.log(JSON.stringify({
            totalVulnerabilities: report.metadata?.vulnerabilities || {},
            highOrCriticalPackages: high,
          }, null, 2));
          NODE
          if [[ "$audit_exit" -gt 1 ]]; then
            exit "$audit_exit"
          fi
          echo "npm audit exit code: $audit_exit (non-blocking diagnostic step)."

      - name: Typecheck
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Git diff check
        run: git diff --check

      - name: Validate migration filenames
        shell: bash
        run: |
          set -euo pipefail
          files=(supabase/migrations/*.sql)
          for file in "${files[@]}"; do
            base="$(basename "$file")"
            if [[ ! "$base" =~ ^[0-9]{14}_[a-z0-9_]+\.sql$ ]]; then
              echo "Invalid migration filename: $base"
              exit 1
            fi
          done
          echo "All migration filenames are valid."

  e2e:
    name: Playwright browser tests
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Resolve E2E configuration
        id: e2e_config
        shell: bash
        env:
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: |
          set -euo pipefail
          echo "VITE_SUPABASE_URL=https://ysmpktqnwbgjhtbzpfhc.supabase.co" >> "$GITHUB_OUTPUT"
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_V6ARx_7Nw_Mo8l_o-TEHrg_uMNl4EJw' }}" >> "$GITHUB_OUTPUT"

          if [[ -n "${E2E_EMAIL:-}" && -n "${E2E_PASSWORD:-}" ]]; then
            echo "authenticated_coverage=true" >> "$GITHUB_OUTPUT"
            echo "Authenticated E2E credentials are configured."
          else
            echo "authenticated_coverage=false" >> "$GITHUB_OUTPUT"
            echo "WARNING: E2E_EMAIL/E2E_PASSWORD are not configured; authenticated E2E coverage will be skipped." >&2
          fi

      - name: Run browser tests
        run: npm run test:e2e
        env:
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          VITE_SUPABASE_URL: ${{ steps.e2e_config.outputs.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ steps.e2e_config.outputs.VITE_SUPABASE_ANON_KEY }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

      - name: Upload Playwright test artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-artifacts
          path: test-results/
          if-no-files-found: ignore
